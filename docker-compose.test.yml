services:
  # Backend unit tests
  backend-test:
    build:
      context: .
      dockerfile: Dockerfile.test
      target: backend-test
    container_name: printops-backend-test
    init: true
    volumes:
      - ./backend:/app/backend:ro
      - ./frontend/src:/app/frontend/src:ro
      - ./scripts:/app/scripts:ro
    environment:
      - TESTING=1
      - PYTHONUNBUFFERED=1

  # Frontend unit tests
  frontend-test:
    build:
      context: .
      dockerfile: Dockerfile.test
      target: frontend-test
    container_name: printops-frontend-test
    volumes:
      - ./frontend/src:/app/frontend/src:ro
      - ./frontend/tests:/app/frontend/tests:ro

  # Integration test - full application
  integration:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: printops-integration-test
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "8001:8000"
    environment:
      - TESTING=1
      - DATA_DIR=/app/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c
          "import os, urllib.request; assert (os.getuid(), os.getgid()) == (1000, 1000);
          urllib.request.urlopen('http://localhost:8000/health', timeout=5).close()"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - integration_test_data:/app/data

  # Integration test runner
  integration-test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
      target: backend-test
    container_name: printops-integration-runner
    init: true
    depends_on:
      integration:
        condition: service_healthy
    environment:
      - PRINTOPS_TEST_URL=http://integration:8000
      - TESTING=1
    # -v dropped + -n auto so integration tests inherit the same noise /
    # parallelism profile as the backend-test image (see Dockerfile.test CMD).
    command: ["pytest", "backend/tests/integration/", "--tb=short", "--timeout=60", "--timeout-method=thread", "-p", "no:cacheprovider", "-n", "auto"]
    volumes:
      - ./backend:/app/backend:ro
      - ./frontend/src:/app/frontend/src:ro
      - ./scripts:/app/scripts:ro

volumes:
  integration_test_data:
