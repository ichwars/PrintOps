vulnerabilities:
  - id: GHSA-r7wm-3cxj-wff9
    paths: &verapdf_cli
      - "opt/verapdf/bin/cli-1.30.2.jar"
    expired_at: 2026-10-31
    statement: &verapdf_statement >-
      veraPDF 1.30.2 uses Jackson only to serialize locally generated validation
      results via ObjectMapper.writeValueAsString. The vulnerable deserialization
      and asynchronous parser paths are not reachable. Reassess when the next
      signed stable veraPDF release is available or before this exception expires.
