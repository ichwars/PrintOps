name: Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Windows installers are published unsigned. Release artifacts still include
# SHA-256 checksums, an explicit unsigned notice and GitHub artifact
# attestations, but no SignPath/Azure secrets or certificate setup is required.
permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+(?:\.\d+)?(?:(?:a|alpha|b|beta|rc)\d+)?(?:-daily\.\d{8})?$') {
            throw "unsupported release tag: $env:GITHUB_REF_NAME"
          }

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Stage installer artifacts
        working-directory: installers/windows
        run: python build.py
        shell: pwsh

      - name: Compile installer (ISCC)
        working-directory: installers/windows
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" printops.iss'
        shell: pwsh

      - name: Create unversioned alias (non-daily tags only)
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-daily.')
        shell: pwsh
        working-directory: installers/windows/build/output
        run: |
          $versioned = Get-ChildItem -Filter "printops-*-windows-x64-setup.exe" | Select-Object -First 1
          if (-not $versioned) { throw "no versioned installer .exe found" }
          Copy-Item $versioned.FullName "printops-windows-x64-setup.exe"

      - name: Prepare unsigned release artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item installers\windows\build\output\*.exe release\
          Push-Location release
          $installers = Get-ChildItem -File -Filter '*.exe'
          if (-not $installers) { throw "no installer .exe found" }
          foreach ($installer in $installers) {
            if ($installer.BaseName.EndsWith("-unsigned", [StringComparison]::OrdinalIgnoreCase)) { continue }
            $unsignedName = "$($installer.BaseName)-unsigned$($installer.Extension)"
            Rename-Item $installer.FullName $unsignedName
          }
          "unsigned" | Set-Content -Encoding ascii SIGNING_STATUS.txt
          @(
            "PrintOps Windows installer is unsigned."
            ""
            "Windows SmartScreen may show an unknown-publisher warning."
            "Verify the downloaded installer against SHA256SUMS.txt before installing."
          ) | Set-Content -Encoding utf8 WINDOWS_INSTALLER_UNSIGNED.txt
          Get-ChildItem -File -Filter '*.exe' |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content -Encoding ascii SHA256SUMS.txt
          Pop-Location

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: printops-windows-installer-release
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download Windows release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: printops-windows-installer-release
          path: release

      - name: Verify Windows release artifact before publication
        shell: pwsh
        run: |
          $installers = Get-ChildItem release -File -Filter '*.exe'
          if (-not $installers) { throw "no installer .exe found" }
          $status = (Get-Content release\SIGNING_STATUS.txt -Raw).Trim()
          if ($status -ne 'unsigned') { throw "unexpected signing status: $status" }

          $expected = @{}
          Get-Content release\SHA256SUMS.txt | ForEach-Object {
            if ($_ -notmatch '^([0-9a-f]{64})  (.+)$') { throw "invalid SHA256SUMS.txt entry: $_" }
            $expected[$Matches[2]] = $Matches[1]
          }
          foreach ($installer in $installers) {
            $actual = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($expected[$installer.Name] -ne $actual) { throw "checksum mismatch: $($installer.Name)" }
          }

      - name: Attest Windows installers
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: release/*.exe

      - name: Remove stale Windows release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $releaseUrl = "https://api.github.com/repos/${env:GITHUB_REPOSITORY}/releases/tags/${env:GITHUB_REF_NAME}"
          try {
            $release = Invoke-RestMethod -Headers $headers -Uri $releaseUrl
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -eq 404) { exit 0 }
            throw
          }
          $assetNamePattern = '^(printops.*windows.*setup.*\.exe|SHA256SUMS\.txt|SIGNING_STATUS\.txt|WINDOWS_INSTALLER_UNSIGNED\.txt|WINDOWS_INSTALLER_SIGNING\.txt|SIGNPATH_SIGNING_REQUEST\.txt)$'
          foreach ($asset in $release.assets) {
            if ($asset.name -match $assetNamePattern) {
              Invoke-RestMethod -Method Delete -Headers $headers -Uri $asset.url
            }
          }

      - name: Attach Windows installers to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release/*
          fail_on_unmatched_files: true
