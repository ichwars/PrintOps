name: Release Container

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    permissions:
      contents: read

    steps:
      - name: Checkout tag objects
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify signed annotated release tag
        shell: bash
        env:
          RELEASE_TAG_SSH_PUBLIC_KEY: ${{ vars.RELEASE_TAG_SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?((a|alpha|b|beta|rc)[0-9]+)?(-daily\.[0-9]{8})?$ ]] || {
            echo "unsupported release tag: $GITHUB_REF_NAME" >&2
            exit 1
          }
          case "$RELEASE_TAG_SSH_PUBLIC_KEY" in
            ssh-*|ecdsa-sha2-*|sk-ssh-*) ;;
            *) echo "RELEASE_TAG_SSH_PUBLIC_KEY is missing or invalid" >&2; exit 1 ;;
          esac
          tag_ref="refs/tags/${GITHUB_REF_NAME}"
          test "$(git cat-file -t "$tag_ref")" = "tag"
          allowed_signers="${RUNNER_TEMP}/release-signers.allowed"
          printf '%s %s\n' 'release@printops' "$RELEASE_TAG_SSH_PUBLIC_KEY" > "$allowed_signers"
          git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile="$allowed_signers" verify-tag "$tag_ref"

  publish:
    needs: verify-release-tag
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release candidate
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ichwars/printops:${{ steps.version.outputs.value }}
            ghcr.io/ichwars/printops:rc
          labels: |
            org.opencontainers.image.source=https://github.com/ichwars/PrintOps
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Attest published container digest
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-name: ghcr.io/ichwars/printops
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
