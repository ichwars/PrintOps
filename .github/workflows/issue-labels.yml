name: Sync issue labels

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/issue-labels.json'
      - '.github/workflows/issue-labels.yml'

permissions:
  contents: read
  issues: write

jobs:
  sync-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Upsert issue labels
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const labels = JSON.parse(fs.readFileSync('.github/issue-labels.json', 'utf8'));

            for (const label of labels) {
              const payload = {
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label.name,
                color: label.color,
                description: label.description,
              };

              try {
                await github.rest.issues.updateLabel(payload);
                core.info(`Updated label "${label.name}".`);
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
                await github.rest.issues.createLabel(payload);
                core.info(`Created label "${label.name}".`);
              }
            }
