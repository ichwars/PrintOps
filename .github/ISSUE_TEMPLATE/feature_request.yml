name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please fill out the form below.

  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - PrintOps
        - SpoolBuddy
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: Is your feature request related to a problem? Please describe the use case.
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see.
      placeholder: It would be great if...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?
      placeholder: I've tried...

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: What area does this feature relate to?
      options:
        - Printer connection / setup
        - Print start / dispatch
        - Filament / AMS / Spoolman
        - Slicer integration (Bambu Studio / OrcaSlicer)
        - Virtual Printer (VP)
        - Camera / live view / timelapse
        - Archives / library / files
        - Statistics
        - Cost Tracking / Energy Overview
        - Order Management / Documents
        - Suppliers / Procurement
        - Print Queue / scheduling
        - Notifications
        - Authentication / users / permissions
        - Updates / firmware check
        - UI / display / theme / i18n
        - API / integrations
        - Windows Installer / Updates
        - Docker / Deployment
        - SpoolBuddy
        - Other / not sure
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Nice to have
        - Would improve my workflow
        - Critical for my use case
    validations:
      required: true

  - type: textarea
    id: mockups
    attributes:
      label: Mockups or Examples
      description: |
        If you have any mockups, screenshots, or examples from other software, please share them.
        💡 Tip: You can drag and drop images directly into this text box.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to help implement this feature
          required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to ensure this feature hasn't already been requested
          required: true
